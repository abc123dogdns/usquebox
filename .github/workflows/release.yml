name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      GOPATH: ${{ github.workspace }}/go
    steps:
      - name: Checkout usquebox
        uses: actions/checkout@v4

      - name: Read usque ref
        id: usque-ref
        run: |
          source usque.ref
          echo "repo=$USQUE_REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$USQUE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout usque
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.usque-ref.outputs.repo }}
          ref: ${{ steps.usque-ref.outputs.ref }}
          path: usque
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;28.1.13356709"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Prepare signing (required for release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release builds require signing secrets (KEYSTORE_BASE64, KEYSTORE_PASS, ALIAS_NAME, ALIAS_PASS)"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > usquebox-release.jks
          cat > keystore.properties <<EOF
          KEYSTORE_FILE=usquebox-release.jks
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME=${{ secrets.ALIAS_NAME }}
          ALIAS_PASS=${{ secrets.ALIAS_PASS }}
          EOF

      - name: Build AAR
        run: bash build.sh

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon -PversionName=${{ inputs.version }}

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $APK)" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          APK="${{ steps.apk.outputs.path }}"
          echo "=== APK signing info ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            ## usquebox v${{ inputs.version }}

            **usque**: `${{ steps.usque-ref.outputs.ref }}`
            **Signed**: V1 + V2 + V3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
