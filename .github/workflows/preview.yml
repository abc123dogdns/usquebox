name: Preview Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Preview APK
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      GOPATH: ${{ github.workspace }}/go
    steps:
      - name: Checkout usquebox
        uses: actions/checkout@v4

      - name: Read usque ref
        id: usque-ref
        run: |
          source usque.ref
          REPO_SLUG=$(echo "$USQUE_REPO" | sed -E 's#https?://github\.com/##; s#\.git$##')
          echo "repo=$REPO_SLUG" >> "$GITHUB_OUTPUT"
          echo "ref=$USQUE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout usque
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.usque-ref.outputs.repo }}
          ref: ${{ steps.usque-ref.outputs.ref }}
          path: usque
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;28.1.13356709"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > usquebox-release.jks
            cat > keystore.properties <<EOF
          KEYSTORE_FILE=usquebox-release.jks
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME=${{ secrets.ALIAS_NAME }}
          ALIAS_PASS=${{ secrets.ALIAS_PASS }}
          EOF
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Signing configured (V1+V2+V3)"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — building unsigned"
          fi

      - name: Build AAR
        run: bash build.sh

      - name: Build APK
        run: |
          if [ "${{ steps.signing.outputs.has_signing }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -print -quit)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $APK)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: usquebox-preview-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
